name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NodeRunner.sln

      - name: Build
        run: dotnet build NodeRunner.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/NodeRunner.Tests/NodeRunner.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
